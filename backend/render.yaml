services:
  - type: web
    name: pac-crm-backend
    env: python
    region: oregon # Or whichever region the user selects on Render
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    plan: free
    envVars:
      - key: APP_NAME
        value: "Pure Air California CRM API"
      - key: APP_VERSION
        value: "1.0.0"
      - key: CORS_ORIGINS
        value: '["https://pureaircalifornia.com", "https://www.pureaircalifornia.com", "https://admin.pureaircalifornia.com", "http://localhost:5173", "http://localhost:5174"]'
      - key: MONGODB_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: W9_DOCUMENT_LINK
        sync: false
      - key: INSURANCE_DOCUMENT_LINK
        sync: false

  - type: cron
    name: pac-drip-cron
    env: python
    region: oregon
    schedule: "0 16 * * 1-5" # Runs at 9:00 AM PST (16:00 UTC), Monday-Friday
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python cron_drip.py"
    plan: starter
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
