<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Optional analytics is initialized once, after consent, by GoogleAnalytics. -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A3D7C" />
  <meta name="author" content="Pure Air California" />

  <!--
    IMPORTANT: do NOT add title / description / keywords / robots / canonical /
    og:* / twitter:* tags here.

    SEOProvider (react-helmet-async) owns all of them per route, including
    per-route LCP hero image preloads so each of the 119 routes only preloads
    its own above-the-fold hero asset rather than downloading a homepage asset
    site-wide. Only tags Helmet never manages belong in this file.
  -->

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/brand/pac-brandmark.svg" />

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Non-blocking Google Fonts (only the exact weights used across CSS & Tailwind) -->
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap"
    as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" />
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
