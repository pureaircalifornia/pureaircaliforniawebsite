<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SK8BHVML0W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-SK8BHVML0W');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="author" content="Pure Air California" />

  <!--
    IMPORTANT: do NOT add title / description / keywords / robots / canonical /
    og:* / twitter:* tags here.

    SEOProvider (react-helmet-async) owns all of them per route. Helmet replaces
    the title element but only APPENDS its own meta tags, so anything duplicated
    here shipped twice on every page — once with the homepage's copy and once with
    the real per-page copy — leaving Google to pick between two conflicting
    descriptions site-wide. Only tags Helmet never manages belong in this file.

    Non-route-specific og tags that Helmet does not set are safe to keep below.
  -->

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/brand/pac-brandmark.svg" />

  <link rel="preload" href="/brand/pac-brandmark.svg" as="image" type="image/svg+xml" />

  <!-- Preconnect for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="dns-prefetch" href="https://www.google-analytics.com">

  <!-- Preload fonts for FCP/LCP improvement -->
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
    as="style" onload="this.onload=null;this.rel='stylesheet'">

  <!-- Preload critical above-the-fold images for LCP optimization -->
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap">
  </noscript>


</head>

<body>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
