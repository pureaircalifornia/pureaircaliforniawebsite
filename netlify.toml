[build]
  base = "frontend"
  publish = "frontend/build"
  command = "npm ci && npm run build"

[build.environment]
  NODE_VERSION = "20"

# Global security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Immutable caching for Vite hashed bundles and media assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always revalidate search & AI discovery files
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Defense-in-depth privacy headers for non-public routes
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/feedback/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# Legacy URL equity redirects
[[redirects]]
  from = "/residential-air-duct-cleaning"
  to = "/services/residential-air-duct-cleaning/"
  status = 301

[[redirects]]
  from = "/commercial-air-duct-cleaning"
  to = "/services/commercial-air-duct-cleaning/"
  status = 301

[[redirects]]
  from = "/dryer-vent-cleaning"
  to = "/services/residential-dryer-vent-cleaning/"
  status = 301

[[redirects]]
  from = "/services/electrostatic-filter-program"
  to = "/services/residential-electrostatic-filter/"
  status = 301

[[redirects]]
  from = "/faq"
  to = "/blog/air-duct-cleaning-faq/"
  status = 301

[[redirects]]
  from = "/specials"
  to = "/pricing/"
  status = 301

# Dynamic SPA routes (prerendered static files take precedence automatically)
[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/feedback/*"
  to = "/index.html"
  status = 200

# SPA catch-all: serve index.html for client-side fallback routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
