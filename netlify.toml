[build]
  base = "frontend"
  publish = "frontend/build"
  command = "npm ci && npm run build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# SPA catch-all: serve index.html for all client-side routes with 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200