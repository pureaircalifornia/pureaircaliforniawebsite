services:
  - type: web
    name: pac-crm-backend
    env: python
    region: oregon # Or whichever region the user selects on Render
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # Render injects $PORT; binding to it is required (was hardcoded 10000).
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Pure Air California CRM API"
      - key: APP_VERSION
        value: "1.0.0"
      - key: CORS_ORIGINS
        value: '["https://pureaircalifornia.com", "https://www.pureaircalifornia.com", "https://admin.pureaircalifornia.com", "http://localhost:5173", "http://localhost:5174"]'
      # REQUIRED by app/config.py — the app FAILS TO BOOT without these two.
      # (Was previously named MONGODB_URL, which the app does not read.)
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true   # Render generates a strong random secret
      - key: DB_NAME
        value: "pureaircalifornia"
      - key: FROM_EMAIL
        value: "lou@pureaircalifornia.com"
      # Public URL of this Render service — powers one-click email unsubscribe.
      # Set to your Render URL after first deploy, e.g. https://pac-crm-backend.onrender.com
      - key: API_PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: W9_DOCUMENT_LINK
        sync: false
      - key: INSURANCE_DOCUMENT_LINK
        sync: false
